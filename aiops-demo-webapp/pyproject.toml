[project]
name = "aiops-training"
version = "1.0.0"
description = "8-Week AIOps Training: From Traditional IT Operations to AgentOps"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "AIOps Training Team"}
]
keywords = ["aiops", "mlops", "azure", "monitoring", "mcp", "rag"]

dependencies = [
    # Core Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    
    # Data Processing & Analysis
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    
    # Machine Learning - Anomaly Detection & Forecasting
    "scikit-learn>=1.4.0",
    "prophet>=1.1.5",
    "statsmodels>=0.14.0",
    
    # Azure SDK
    "azure-identity>=1.15.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-containerservice>=28.0.0",
    "azure-mgmt-cosmosdb>=9.4.0",
    "azure-mgmt-redis>=14.3.0",
    "azure-mgmt-servicebus>=8.2.0",
    "azure-mgmt-monitor>=6.0.0",
    "azure-monitor-query>=1.2.0",
    "azure-cosmos>=4.5.0",
    "azure-storage-blob>=12.19.0",
    
    # Azure AI Services
    "openai>=1.12.0",
    "azure-search-documents>=11.4.0",
    "tiktoken>=0.5.0",
    
    # Vector Database (RAG)
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.0",
    
    # MCP (Model Context Protocol)
    "httpx>=0.26.0",
    "sse-starlette>=1.8.0",
    "websockets>=12.0",
    
    # Observability & Telemetry
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-exporter-otlp>=1.22.0",
    "azure-monitor-opentelemetry>=1.2.0",
    
    # Database Clients
    "redis>=5.0.0",
    "motor>=3.3.0",
    
    # Messaging
    "azure-servicebus>=7.11.0",
    
    # HTTP & API
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    
    # CLI & Terminal
    "typer>=0.9.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    
    # Utilities
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    
    # Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "ruff>=0.1.14",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
