apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  # Connection strings (REPLACE WITH REAL VALUES IN CLUSTER)
  COSMOS_DB_CONNECTION_STRING: "AccountEndpoint=https://placeholder.documents.azure.com:443/;AccountKey=placeholder;"
  COSMOS_DB_DATABASE_NAME: "ecommerce"
  COSMOS_DB_CONTAINER_NAME: "products"
  REDIS_HOST: "placeholder.redis.cache.windows.net"
  REDIS_PORT: "6380"
  REDIS_PASSWORD: "placeholder-redis-key"
  SERVICE_BUS_CONNECTION_STRING: "Endpoint=sb://placeholder.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=placeholder"
  
  # JWT Settings
  SECRET_KEY: "your-super-secret-key-change-in-production"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"