apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: aiopstrainacr.azurecr.io/payment-service:v1
        ports:
        - containerPort: 8005
        env:
        - name: COSMOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: COSMOS_DB_ENDPOINT
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: COSMOS_DB_KEY
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8005
  type: ClusterIP
