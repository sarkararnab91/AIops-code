apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: aiopstrainacr.azurecr.io/inventory-service:v1
        ports:
        - containerPort: 8002
        env:
        - name: COSMOS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: COSMOS_DB_ENDPOINT
        - name: COSMOS_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: COSMOS_DB_KEY
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        - name: SERVICE_BUS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SERVICE_BUS_CONNECTION_STRING
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8002
  type: ClusterIP
