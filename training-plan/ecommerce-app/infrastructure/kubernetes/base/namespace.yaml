# Kubernetes Namespace and ConfigMap for E-Commerce Services
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    app: ecommerce
    project: aiops-training
---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  # Service URLs
  CATALOG_SERVICE_URL: "http://catalog-service:8001"
  INVENTORY_SERVICE_URL: "http://inventory-service:8002"
  ORDER_SERVICE_URL: "http://order-service:8003"
  CART_SERVICE_URL: "http://cart-service:8004"
  PAYMENT_SERVICE_URL: "http://payment-service:8005"
  USER_SERVICE_URL: "http://user-service:8006"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8007"
  
  # Environment
  ENV: "production"
  LOG_LEVEL: "INFO"
  
  # Redis (non-sensitive)
  REDIS_PORT: "6380"
  REDIS_SSL: "true"
---
# Secret template (values should be set via Azure Key Vault or CI/CD)
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # These are placeholder values - replace with actual secrets
  COSMOS_ENDPOINT: "https://your-cosmos-account.documents.azure.com:443/"
  COSMOS_KEY: "your-cosmos-key"
  REDIS_HOST: "your-redis.redis.cache.windows.net"
  REDIS_PASSWORD: "your-redis-password"
  APPLICATIONINSIGHTS_CONNECTION_STRING: "InstrumentationKey=xxx;IngestionEndpoint=https://xxx.in.applicationinsights.azure.com/"
  PASSWORD_SALT: "your-password-salt"
